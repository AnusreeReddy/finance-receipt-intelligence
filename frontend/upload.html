<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Receipt - Receipt Intelligence</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: block;">
    <nav class="navbar">
        <h1>Receipt Intelligence</h1>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="upload.html">Upload Receipt</a>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Upload & Process Receipt</h2>
            <div class="drop-zone" id="drop-zone">
    <p>Upload a receipt image</p>

    <button type="button" id="upload-btn" class="btn">
        Choose Receipt Image
    </button>

    <p id="selected-file">No file selected</p>

    <input
        type="file"
        id="file-input"
        accept="image/*"
        style="display: none;"
    >
</div>

            <p id="processing-status" role="status" aria-live="polite" style="display: none;"></p>
            <div id="spinner" class="spinner"></div>
        </div>

        <div id="review-section" class="grid-2" style="display: none;">
            <div class="card">
                <h3>Receipt Preview</h3>
                <img id="receipt-preview" class="preview-img" src="" alt="Receipt Image">
            </div>

            <div class="card">
                <h3>Review Extracted Data</h3>
                <form id="review-form">
                    <div class="form-group">
                        <label>Merchant Name</label>
                        <input type="text" id="merchant-name" required>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="receipt-date" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" class="form-group" style="width:100%; padding:0.75rem;">
                            <option value="Food">Food</option>
<option value="Travel">Travel</option>
<option value="Entertainment">Entertainment</option>
<option value="Shopping">Shopping</option>
<option value="Health">Health</option>
<option value="Utilities">Utilities</option>
<option value="Education">Education</option>
<option value="Housing">Housing</option>
<option value="Insurance">Insurance</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <input type="text" id="payment-method" required>
                    </div>
                    <div class="form-group">
                        <label>Subtotal ($)</label>
                        <input type="number" step="0.01" id="subtotal">
                    </div>
                    <div class="form-group">
                        <label>Tax ($)</label>
                        <input type="number" step="0.01" id="tax">
                    </div>
                    <div class="form-group">
                        <label>Total ($)</label>
                        <input type="number" step="0.01" id="total" required>
                    </div>

                    <h4>Line Items</h4>
                    <table class="items-table">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Qty</th>
                                <th>Price ($)</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="items-tbody"></tbody>
                    </table>
                    <button type="button" id="add-item-btn" class="btn" style="background:#718096; margin-top:0.5rem;">+ Add Line Item</button>

                    <button type="submit" class="btn" style="margin-top:1.5rem;">Confirm & Save Expense</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/upload.js"></script>
</body>
</html>
